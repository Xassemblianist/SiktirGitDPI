# SiktirGitDPI preset - Guvenli mod (yeni baslayanlar icin onerilen).
#
# Bu profil:
#   - Sadece bilinen-engelli sitelere mudahale eder (allowlist)
#   - Banka/devlet sitelerine asla dokunmaz (banks-safelist'e bagimli degil
#     cunku zaten allowlist-only - listede olmayan her sey dogal akar)
#   - DNS hijack koruması icin DoH-friendly resolver'a transparent redirect
#   - Flow tracking ile uzun baglantilarda gereksiz strateji uygulamaz
#   - ISP'nin gonderdigi sahte RST paketlerini dusurur

strategies       = tls-split,fake-ttl,wrong-chksum,http-mangle
tls_split_mode   = midsni
fake_ttl         = -1                       # -1 = auto, ICMP probe ile bulur
fake_repeat      = 1
http_mangle_case = true

# Domain whitelist - sadece bunlara mudahale et
domain_mode      = allowlist
domain_file      = presets/blocked-sites.txt

# DNS hijack koruması (TT/Vodafone DNS'ini bypass et)
dns_redirect     = true
dns_upstream     = 1.1.1.1

# ISP sahte RST koruması
inbound_rst_drop = true

# Flow tracking
flow_tracking    = true

ports            = 80,443
log_level        = info
