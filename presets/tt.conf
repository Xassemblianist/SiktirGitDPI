# SiktirGitDPI preset - Türk Telekom (TTNET) varsayilan profili.
#
# TT'nin DPI'si SNI'de oturum koklayip TLS Reset gonderiyor; HTTP'de Host
# header tabaninda ISS yonlendirme sayfasi servis ediyor. Asagidaki
# kombinasyon her ikisini de delmek icin denenmis varsayilan.

strategies       = tls-split,fake-ttl,wrong-chksum,http-mangle
tls_split_mode   = midsni
fake_ttl         = 4
fake_repeat      = 1
http_mangle_case = true
http_extra_space = true
ports            = 80,443
log_level        = info

# TT'nin DNS sunuculari (195.175.39.39 vs.) bilinen domain'leri hijack
# ediyor. DoH yapamiyoruz ama UDP/53'u Cloudflare'a yonlendirebiliriz.
dns_redirect     = true
dns_upstream     = 1.1.1.1

# TT sahte RST gonderiyor - bunlari dusur.
inbound_rst_drop = true

# Flow tracking ile uzun YouTube oturumlarinda her segment isin uzerine
# gitmek yerine sadece ilk ClientHello'yu degistir.
flow_tracking    = true
