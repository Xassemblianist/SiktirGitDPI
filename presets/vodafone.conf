# SiktirGitDPI preset - Vodafone Net.
#
# Vodafone'da TLS record fragmentation cogu zaman SNI tabanli
# filtreyi atliyor. HTTP icin de host mangle yeterli.
# Vodafone DNS hijack yapiyor, redirect aktif.

strategies       = tls-frag,tls-split,wrong-chksum,http-mangle
tls_split_mode   = presni
fake_ttl         = 4
fake_repeat      = 1
http_mangle_case = true
ports            = 80,443
log_level        = info
dns_redirect     = true
dns_upstream     = 1.1.1.1
inbound_rst_drop = true
flow_tracking    = true
