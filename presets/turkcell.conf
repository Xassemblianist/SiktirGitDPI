# SiktirGitDPI preset - Turkcell Superonline.
#
# Superonline'da SNI tabanli filtreleme baskin; fake-TTL desync stateful
# DPI'lere karsi etkili. Auto-TTL kullanmak isterseniz CLI'da
# '--fake-ttl auto --auto-ttl 1.1.1.1' parametrelerini kullanin.

strategies       = tls-split,fake-ttl,wrong-chksum,http-mangle
tls_split_mode   = midsni
fake_ttl         = 5
fake_repeat      = 2
http_mangle_case = true
http_extra_space = false
ports            = 80,443
log_level        = info
dns_redirect     = true
dns_upstream     = 1.1.1.1
inbound_rst_drop = true
flow_tracking    = true
