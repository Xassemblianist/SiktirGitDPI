# SiktirGitDPI preset - Agresif.
#
# Tum stratejileri sirayla deneyen profil. Genel olarak hangi yontemin
# isleyecegini bilmediginiz baslangiclar icin. Performans icin uygun degil
# (pipeline her pakette tum stratejileri tariyor).

strategies = tls-split,tls-frag,fake-ttl,wrong-chksum,disorder,http-mangle,oob,md5-opt,zero-window
tls_split_mode = midsni
fake_ttl = -1
fake_repeat = 2
http_mangle_case = true
http_extra_space = true
http_split_url = true
ports = 80,443
log_level = debug

# Her sey acik
dns_redirect = true
dns_upstream = 1.1.1.1
inbound_rst_drop = true
flow_tracking = true
